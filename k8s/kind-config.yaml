kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: fraud
networking:
  disableDefaultCNI: true
  podSubnet: "192.168.0.0/16"
  apiServerAddress: "127.0.0.1"
  apiServerPort: 6550
nodes:
  - role: control-plane
    extraPortMappings:
      - containerPort: 30080
        hostPort: 8080
        protocol: TCP
      - containerPort: 30443
        hostPort: 8443
        protocol: TCP
  - role: worker
  - role: worker